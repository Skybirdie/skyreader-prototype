<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>SkyReader</title>

<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SkyReader">

<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/reader.css">
<link rel="stylesheet" href="css/library.css">

<link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
<link rel="icon" href="/favicon.ico" type="image/x-icon">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="page-flip.browser.js"></script>

</head>

<body>

<div id="app">

<header id="topBar">

<button id="libraryButton" class="iconButton" title="Library">
<svg class="icon"><use href="#icon-library"></use></svg>
</button>



<h1 id="appTitle"></h1>


<button id="settingsButton" class="iconButton" title="Settings">
<svg class="icon"><use href="#icon-settings"></use></svg>
</button>

</header>

<main id="workspace">

<aside id="libraryPanel" class="visible">

<section id="continueReading">

<h2>Reading...</h2>

<div id="continueCard" class="placeholderCard">

<div class="coverPlaceholder"></div>

<div class="placeholderText">

<h3>No recent magazine</h3>

<p>Select a publication below.</p>

</div>

</div>

</section>

<section id="recentSection">

<div class="sectionHeader">

<h2>Library</h2>

<div id="viewButtons">

<button id="shelfViewButton" class="viewButton active" title="Grid view" aria-label="Grid view">
<svg class="icon"><use href="#icon-grid"></use></svg>
</button>

<button id="listViewButton" class="viewButton">
<svg class="icon"><use href="#icon-list"></use></svg>
</button>

</div>

</div>

<div id="searchWrapper">

<input
id="searchBox"
type="search"
placeholder="Search publications..."
aria-label="Search publications">

<button id="searchToggleButton" class="libraryFloatingButton" type="button" title="Search publications" aria-label="Search publications" aria-expanded="false">
<svg class="icon"><use href="#icon-search"></use></svg>
</button>

</div>

<div id="libraryContent">

<div id="shelfView" class="libraryView"></div>

<div id="listView" class="libraryView hidden"></div>

</div>

</section>

</aside>

<section id="readerPanel">

<div id="viewerBackground">

<div id="viewerArea">

<!--
     Responsive library landing:
     visible whenever no magazine is active, then replaced by the
     selected book. The same library data is used so this never
     becomes a second source of truth.
-->
<div id="viewerLibrary" class="viewerLibrary" aria-label="SkyReader library">

<div class="viewerLibraryHero">

<div class="viewerLibraryVector" aria-hidden="true">
<svg viewBox="0 0 120 120" role="img">
<path d="M26 31c0-5 4-9 9-9h45c8 0 14 6 14 14v48c0-6-5-11-11-11H35c-5 0-9 4-9 9V31Z"
fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round"/>
<path d="M26 82c0-5 4-9 9-9h48c6 0 11 5 11 11"
fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
<path d="M48 39h28M48 51h20"
fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
</svg>
</div>

<div>
<h2>Start Reading</h2>
<p>Choose a publication to begin.</p>
</div>

</div>

<div id="viewerContinue" class="viewerContinue hidden"></div>

<div id="viewerLibraryScroll" class="viewerLibraryScroll">
<div id="viewerShelfView" class="viewerShelfView"></div>
</div>

</div>

<div id="loading" aria-live="polite" aria-busy="true">
<div class="loadingOverlayInner">
<img id="loadingImage" src="assets/loading.gif" alt="Loading book">
<span id="loadingText">Loading...</span>
</div>
</div>

<div id="pageContainer"></div>

</div>

</div>

<nav id="toolbar">

<button id="previousButton" class="iconButton">
<svg class="icon"><use href="#icon-previous"></use></svg>
</button>

<button id="rotateButton" class="iconButton" aria-label="Rotate">↻</button>

<button id="muteButton" class="iconButton">
<svg class="icon"><use href="#icon-volume"></use></svg>
</button>

<button id="viewerFullscreenButton" class="iconButton viewerFullscreenToolbarButton" type="button" title="Focus viewer" aria-label="Focus viewer" aria-pressed="false">
<svg class="icon"><use href="#icon-fullscreen"></use></svg>
</button>

<button id="nextButton" class="iconButton">
<svg class="icon"><use href="#icon-next"></use></svg>
</button>

</nav>


<div id="statusBar">
<center>
<span id="statusMessage"></span>
<span id="readerTitle"></span>
<span id="pageIndicator" role="button" tabindex="0" aria-label="Current page. Activate to jump to a page."></span>
<div id="pageJump" hidden aria-hidden="true">
<label for="pageJumpInput">Go to page</label>
<div class="pageJumpRow">
<input id="pageJumpInput" type="number" inputmode="numeric" min="1" step="1" autocomplete="off" aria-label="Page number">
<button id="pageJumpButton" type="button">Go</button>
</div>
</div>
</center>
</div>
<div style="background:rgba(255,255,255,.92)";><center>Welcome to SkyReader</center></div>


</section>

</main>

</div>

<!-- SVG ICONS -->

<svg xmlns="http://www.w3.org/2000/svg" style="display:none">

<symbol id="icon-library" viewBox="0 0 24 24">
<path d="M4 6h16M4 12h16M4 18h16"
stroke="currentColor"
stroke-width="2"
stroke-linecap="round"/>
</symbol>

<symbol id="icon-search" viewBox="0 0 24 24">
<circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/>
<path d="M16 16l5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
</symbol>

<symbol id="icon-settings" viewBox="0 0 24 24">
<path d="M12 8a4 4 0 100 8a4 4 0 000-8zm9 4l-2.2.8l.2 2.3l-2 1.2l-1.7-1.5l-2.1.9l-.5 2.2h-2.4l-.5-2.2l-2.1-.9l-1.7 1.5l-2-1.2l.2-2.3L3 12l.8-2.2l-1.5-1.7l1.2-2l2.3.2L7 4l2.2-.5V1.1h2.4V3.5l2.2.5l.9 2.1l2.3-.2l1.2 2l-1.5 1.7z"
fill="none"
stroke="currentColor"
stroke-width="1.4"
stroke-linejoin="round"/>
</symbol>

<symbol id="icon-grid" viewBox="0 0 24 24">
<rect x="4" y="4" width="6" height="6" rx="1" fill="currentColor"/>
<rect x="14" y="4" width="6" height="6" rx="1" fill="currentColor"/>
<rect x="4" y="14" width="6" height="6" rx="1" fill="currentColor"/>
<rect x="14" y="14" width="6" height="6" rx="1" fill="currentColor"/>
</symbol>

<symbol id="icon-list" viewBox="0 0 24 24">
<path d="M6 7h14M6 12h14M6 17h14"
stroke="currentColor"
stroke-width="2"
stroke-linecap="round"/>
<circle cx="3" cy="7" r="1.2" fill="currentColor"/>
<circle cx="3" cy="12" r="1.2" fill="currentColor"/>
<circle cx="3" cy="17" r="1.2" fill="currentColor"/>
</symbol>

<symbol id="icon-previous" viewBox="0 0 24 24">
<path d="M15 5L8 12L15 19"
stroke="currentColor"
stroke-width="2.3"
stroke-linecap="round"
stroke-linejoin="round"/>
</symbol>

<symbol id="icon-next" viewBox="0 0 24 24">
<path d="M9 5L16 12L9 19"
stroke="currentColor"
stroke-width="2.3"
stroke-linecap="round"
stroke-linejoin="round"/>
</symbol>

<symbol id="icon-rotate" viewBox="0 0 24 24"></symbol>

<symbol id="icon-volume" viewBox="0 0 24 24">
<path d="M5 10H9L14 6V18L9 14H5Z"
fill="currentColor"/>
<path d="M17 9C18.5 10.2 18.5 13.8 17 15"
stroke="currentColor"
stroke-width="2"
stroke-linecap="round"/>
</symbol>

<symbol id="icon-fullscreen" viewBox="0 0 24 24">
<path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</symbol>

<symbol id="icon-fullscreen-exit" viewBox="0 0 24 24">
<path d="M9 3v6H3M15 3v6h6M9 21v-6H3M15 21v-6h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</symbol>

<symbol id="icon-muted" viewBox="0 0 24 24">
<path d="M5 10H9L14 6V18L9 14H5Z"
fill="currentColor"/>
<path d="M17 9L22 14M22 9L17 14"
stroke="currentColor"
stroke-width="2"
stroke-linecap="round"/>
</symbol>

</svg>

<script src="js/skyreader.js"></script>
<script src="js/icons.js"></script>
<script src="js/storage.js"></script>
<script src="js/manifest.js"></script>
<script src="js/library.js"></script>
<script src="js/animation.js"></script>
<script src="js/audio.js"></script>
<script src="js/pdfengine.js"></script>
<script src="js/sky180flipengine.js"></script>
<script src="js/renderer.js"></script>
<script src="js/reader.js"></script>
<script src="js/navigation.js"></script>
<script src="js/viewer.js"></script>
<script src="js/gestures.js"></script>
<script src="js/ui.js"></script>
<script src="js/settingsPanel.js"></script>
<script src="js/app.js"></script>

</body>
</html>
